<style>

<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md text-body-md">

<div class="flex items-center gap-3">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors">

</div>
<!-- Scanner Area -->

<!-- Animated Ring -->
<div class="absolute inset-0 rounded-full border-4 border-primary/30 pulse-ring-anim"></div>
<!-- Main Circular Frame -->

<div class="absolute left-0 right-0 h-[2px] bg-primary shadow-[0_0_15px_rgba(30,64,175,0.8)] scan-line-anim"></div>

<!-- Bottom Navigation Bar (Suppressed due to Linear/Transactional Login context) -->
<!-- As per 'Shell Visibility & Relevance' rule, BottomNavBar is excluded for login/auth screens -->
<script>
        // Micro-interaction for the Retry button to simulate a refresh of the scan
        const retryBtn = document.getElementById('retry-btn');
        const scannerLine = document.querySelector('.scan-line-anim');
        
        retryBtn.addEventListener('click', () => {
            // Briefly pause and restart animation
            scannerLine.style.animation = 'none';
            retryBtn.innerText = 'Initializing...';
            
            setTimeout(() => {
                scannerLine.style.animation = '';
                retryBtn.innerHTML = '<span class="material-symbols-outlined">refresh</span> RETRY SCAN';
            }, 500);
        });

        // Toggle Dark Mode (Optional utility for testing)
        // document.documentElement.classList.toggle('dark');
    </script>
