name: Deploy Flutter Web

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4



      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Flutter source
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build Flutter Web
        run: |
          DART_DEFINES=()
          if [ -n "${FIREBASE_WEB_API_KEY}" ]; then DART_DEFINES+=(--dart-define=FIREBASE_WEB_API_KEY="${FIREBASE_WEB_API_KEY}"); fi
          if [ -n "${FIREBASE_WEB_APP_ID}" ]; then DART_DEFINES+=(--dart-define=FIREBASE_WEB_APP_ID="${FIREBASE_WEB_APP_ID}"); fi
          if [ -n "${FIREBASE_WEB_VAPID_KEY}" ]; then DART_DEFINES+=(--dart-define=FIREBASE_WEB_VAPID_KEY="${FIREBASE_WEB_VAPID_KEY}"); fi
          if [ -n "${PAYROLL_API_BASE_URL}" ]; then DART_DEFINES+=(--dart-define=PAYROLL_API_BASE_URL="${PAYROLL_API_BASE_URL}"); fi
          if [ -n "${PAYROLL_API_KEY}" ]; then DART_DEFINES+=(--dart-define=PAYROLL_API_KEY="${PAYROLL_API_KEY}"); fi
          flutter build web --release --base-href /attendance/ "${DART_DEFINES[@]}"
        env:
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          FIREBASE_WEB_APP_ID: ${{ secrets.FIREBASE_WEB_APP_ID }}
          FIREBASE_WEB_VAPID_KEY: ${{ secrets.FIREBASE_WEB_VAPID_KEY }}
          PAYROLL_API_BASE_URL: ${{ secrets.PAYROLL_API_BASE_URL }}
          PAYROLL_API_KEY: ${{ secrets.PAYROLL_API_KEY }}

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
          

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
