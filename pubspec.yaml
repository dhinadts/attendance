name: attendance
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.3
  go_router: ^17.2.3
  google_fonts: ^8.1.0
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  cloud_firestore: ^6.4.1
  firebase_messaging: ^16.2.2
  flutter_local_notifications: ^21.0.0
  riverpod: ^3.2.1
  flutter_riverpod: ^3.2.1
  http: ^1.6.0
  web: ^1.1.1
  camera: ^0.12.0+1
  geolocator: ^14.0.2
  google_mlkit_face_detection: ^0.13.2
  path_provider: ^2.1.5
  device_info_plus: ^12.4.0
  shared_preferences: ^2.5.5
  file_picker: ^10.3.7
  excel: ^4.0.6
  
dependency_overrides:
  lints: ^3.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/app_logo.png
  min_sdk_android: 23
